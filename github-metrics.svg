  <g transform="translate(28, 354)">
    <text x="0" y="16" class="section-title">Specialized Engineering Domains:</text>
    <g transform="translate(260, -2)">
      <rect x="0" y="0" width="80" height="26" class="badge-bg" />
      <text x="40" y="17" text-anchor="middle" class="badge-text">#GenerativeAI</text>

      <rect x="88" y="0" width="60" height="26" class="badge-bg" />
      <text x="118" y="17" text-anchor="middle" class="badge-text">#LLM-RAG</text>

      <rect x="156" y="0" width="84" height="26" class="badge-bg" />
      <text x="198" y="17" text-anchor="middle" class="badge-text">#FAISS-Search</text>

      <rect x="248" y="0" width="68" height="26" class="badge-bg" />
      <text x="282" y="17" text-anchor="middle" class="badge-text">#FastAPI</text>

      <rect x="324" y="0" width="68" height="26" class="badge-bg" />
      <text x="358" y="17" text-anchor="middle" class="badge-text">#Nextjs</text>

      <rect x="400" y="0" width="82" height="26" class="badge-bg" />
      <text x="441" y="17" text-anchor="middle" class="badge-text">#PostgreSQL</text>

      <rect x="490" y="0" width="64" height="26" class="badge-bg" />
      <text x="522" y="17" text-anchor="middle" class="badge-text">#PyTorch</text>
    </g>
