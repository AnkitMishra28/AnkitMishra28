<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420" fill="none">
  <defs>
    <style>
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1px; rx: 12px; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 600; fill: #58a6ff; }
      .header-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .section-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #c9d1d9; }
      .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; fill: #8b949e; }
      .stat-value { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #f0f6fc; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 500; fill: #58a6ff; }
      .badge-bg { fill: #161b22; stroke: #30363d; rx: 6px; }
      .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .lang-pct { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; fill: #8b949e; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="420" class="bg" />

  <!-- Header -->
  <g transform="translate(28, 28)">
    <circle cx="16" cy="16" r="16" fill="#161b22" stroke="#30363d" />
    <path d="M16 8a8 8 0 100 16 8 8 0 000-16zm-1 4h2v5h-2zm0 7h2v2h-2z" fill="#58a6ff" />
    <text x="44" y="16" class="header-title">Ankit Mishra (@AnkitMishra28) — Developer Metrics</text>
    <text x="44" y="32" class="header-sub">Timezone: Asia/Kolkata (IST) • Full-Stack &amp; GenAI Software Engineer</text>
  </g>

  <!-- Divider -->
  <line x1="28" y1="78" x2="822" y2="78" stroke="#21262d" stroke-width="1" />

  <!-- Left Column: Activity & Overview -->
  <g transform="translate(28, 96)">
    <text x="0" y="14" class="section-title">Contribution &amp; Activity Overview</text>
    
    <g transform="translate(0, 30)">
      <rect x="0" y="0" width="370" height="38" rx="6" fill="#161b22" />
      <text x="16" y="24" class="stat-label">Production Software Projects</text>
      <text x="354" y="24" text-anchor="end" class="stat-value">CreditLens, Semantic Search, SenseAI</text>
    </g>

    <g transform="translate(0, 76)">
      <rect x="0" y="0" width="370" height="38" rx="6" fill="#161b22" />
      <text x="16" y="24" class="stat-label">Primary Development Focus</text>
      <text x="354" y="24" text-anchor="end" class="stat-value">Full-Stack AI • LLMs • RAG • Vector DBs</text>
    </g>

    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="370" height="38" rx="6" fill="#161b22" />
      <text x="16" y="24" class="stat-label">Professional Experience</text>
      <text x="354" y="24" text-anchor="end" class="stat-value">SWE Intern @ Infinoid Technologies</text>
    </g>

    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="370" height="38" rx="6" fill="#161b22" />
      <text x="16" y="24" class="stat-label">Active Academic Degree</text>
      <text x="354" y="24" text-anchor="end" class="stat-value">B.Tech CSE @ IIIT Vadodara</text>
    </g>
  </g>

  <!-- Right Column: Language Distribution -->
  <g transform="translate(440, 96)">
    <text x="0" y="14" class="section-title">Most Used Languages</text>

    <!-- Language Progress Bar -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="382" height="12" rx="6" fill="#21262d" />
      <!-- Python (38%) -->
      <rect x="0" y="0" width="145" height="12" rx="6" fill="#3572A5" />
      <!-- TypeScript (28%) -->
      <rect x="147" y="0" width="107" height="12" rx="0" fill="#3178c6" />
      <!-- JavaScript (18%) -->
      <rect x="256" y="0" width="69" height="12" rx="0" fill="#f1e05a" />
      <!-- C++ (10%) -->
      <rect x="327" y="0" width="38" height="12" rx="0" fill="#f34b7d" />
      <!-- Other (6%) -->
      <rect x="367" y="0" width="15" height="12" rx="6" fill="#e34c26" />
    </g>

    <!-- Language Legend Grid -->
    <g transform="translate(0, 64)">
