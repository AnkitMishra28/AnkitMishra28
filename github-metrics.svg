      <circle cx="6" cy="6" r="5" fill="#3572A5" />
      <text x="20" y="10" class="lang-name">Python</text>
      <text x="160" y="10" text-anchor="end" class="lang-pct">38.0%</text>

      <circle cx="210" cy="6" r="5" fill="#3178c6" />
      <text x="224" y="10" class="lang-name">TypeScript</text>
      <text x="370" y="10" text-anchor="end" class="lang-pct">28.0%</text>

      <!-- Row 2 -->
      <circle cx="6" cy="36" r="5" fill="#f1e05a" />
      <text x="20" y="40" class="lang-name">JavaScript</text>
      <text x="160" y="40" text-anchor="end" class="lang-pct">18.0%</text>

      <circle cx="210" cy="36" r="5" fill="#f34b7d" />
      <text x="224" y="40" class="lang-name">C++</text>
      <text x="370" y="40" text-anchor="end" class="lang-pct">10.0%</text>

      <!-- Row 3 -->
      <circle cx="6" cy="66" r="5" fill="#e34c26" />
      <text x="20" y="70" class="lang-name">HTML/CSS</text>
      <text x="160" y="70" text-anchor="end" class="lang-pct">4.0%</text>

      <circle cx="210" cy="66" r="5" fill="#336791" />
      <text x="224" y="70" class="lang-name">SQL</text>
      <text x="370" y="70" text-anchor="end" class="lang-pct">2.0%</text>
    </g>

    <!-- Habits / Highlights -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="382" height="38" rx="6" fill="#161b22" />
      <text x="16" y="24" class="stat-label">Peak Coding Activity</text>
      <text x="366" y="24" text-anchor="end" class="stat-value">Evening &amp; Night (Asia/Kolkata)</text>
    </g>
  </g>

  <!-- Divider -->
  <line x1="28" y1="334" x2="822" y2="334" stroke="#21262d" stroke-width="1" />

