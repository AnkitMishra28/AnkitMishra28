name: Generate Profile Metrics

on:
  schedule:
    - cron: "0 18 * * *" # Runs daily at 18:00 UTC (23:30 IST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate Summary Cards via Official Action
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: AnkitMishra28
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: tokyonight
          AUTO_PUSH: false
        continue-on-error: true

      - name: Generate and Validate Static Profile Metrics
        run: |
          python scripts/generate_metrics.py

      - name: Commit and Push Updated Metrics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/ profile-summary-card-output/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update static profile metrics [skip ci]"
            git push
          else
            echo "No metric changes to commit."
          fi
